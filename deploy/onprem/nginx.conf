# Who is really visiting. Cloudflare puts the visitor's address in CF-Connecting-IP and the country in
# CF-IPCountry, but any client can send those headers too. So they are believed only when the connection
# comes from the tunnel: cloudflared runs on this machine and reaches the website from Docker's own
# networks (loopback, Docker's bridge networks, the VM Docker Desktop for Mac runs in). From any other
# address, such as a device on your network, they are ignored and the connecting address is logged.
# (If Docker hides your devices' addresses, a device on your network also looks like the tunnel; keep
# WEB_BIND=127.0.0.1 whenever you use a tunnel. See README, "Seeing real visitor addresses".)
geo $from_tunnel {
    default          0;
    127.0.0.1/32     1;
    172.16.0.0/12    1;
    192.168.65.0/24  1;
}

# The value must also be a bare address or a two-character country code: no spaces or quotes, so a forged
# header cannot add fake fields to a log line.
map "$from_tunnel:$http_cf_connecting_ip" $visitor_ip {
    "~^1:(?<tunnel_ip>[0-9a-fA-F:.]{2,45})$"  $tunnel_ip;
    default                                   $remote_addr;
}

map "$from_tunnel:$http_cf_ipcountry" $visitor_country {
    "~^1:(?<tunnel_country>[A-Za-z0-9]{2})$"  $tunnel_country;
    default                                   "-";
}

# HSTS tells browsers to use HTTPS only. It is sent only when the request arrived over HTTPS (Cloudflare sets
# X-Forwarded-Proto: https for a tunnel); over plain HTTP browsers ignore it anyway. An empty value is not sent.
map $http_x_forwarded_proto $hsts_header {
    default  "";
    https    "max-age=31536000";
}

# One line per request: time, visitor, country (Cloudflare tunnel only, else "-"), method + path WITHOUT the
# query string (links in emails carry one-time tokens), status, bytes, seconds, browser.
log_format visitors '$time_iso8601 $visitor_ip "$visitor_country" "$request_method $uri" $status $body_bytes_sent ${request_time}s "$http_user_agent"';

# Serves the built frontend and forwards /api to the backend container.
# Security headers match frontend/vercel.json (without the Render origin in connect-src).

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /dev/stdout visitors;
    error_log /dev/stderr warn;
    root /usr/share/nginx/html;
    index index.html;

    # Receipts and statements are uploaded through the API.
    client_max_body_size 25m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security $hsts_header always;

    # The daily digest is triggered by the digest container, which calls the backend directly, so this route
    # is not needed from outside. (^~ also covers variants such as a trailing slash.)
    location ^~ /api/alerts/send-digest {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # One proxy in front of the backend: set TRUSTED_PROXY_COUNT=1 in .env.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
    }

    # Fingerprinted build files never change, so browsers can keep them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header in a location replaces the server-level ones, so repeat them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security $hsts_header always;
    }

    # Single-page app: unknown paths load index.html (never cached, so updates show up).
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security $hsts_header always;
        try_files $uri /index.html;
    }
}
