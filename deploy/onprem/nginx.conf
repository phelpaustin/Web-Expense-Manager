# The real visitor address: Cloudflare puts it in CF-Connecting-IP; on the local network use the connection.
map $http_cf_connecting_ip $visitor_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# One line per request: time, visitor, country (Cloudflare), method + path WITHOUT the query string
# (links in emails carry one-time tokens), status, bytes, seconds, browser.
log_format visitors '$time_iso8601 $visitor_ip "$http_cf_ipcountry" "$request_method $uri" $status $body_bytes_sent ${request_time}s "$http_user_agent"';

# Serves the built frontend and forwards /api to the backend container.
# Security headers match frontend/vercel.json (without the Render origin in connect-src).

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /dev/stdout visitors;
    error_log /dev/stderr warn;
    root /usr/share/nginx/html;
    index index.html;

    # Receipts and statements are uploaded through the API.
    client_max_body_size 25m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # One proxy in front of the backend: set TRUSTED_PROXY_COUNT=1 in .env.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
    }

    # Fingerprinted build files never change, so browsers can keep them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header in a location replaces the server-level ones, so repeat them.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Single-page app: unknown paths load index.html (never cached, so updates show up).
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri /index.html;
    }
}
