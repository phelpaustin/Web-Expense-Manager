name: Send budget alert digest

# Free alternative to a paid Render cron job: GitHub Actions calls the
# backend's protected digest endpoint on a schedule (daily at 07:00 UTC).
#
# Repo secrets required:
#   ALERT_DIGEST_URL  e.g. https://expense-backend.onrender.com/api/alerts/send-digest
#   CRON_SECRET       must match the backend's CRON_SECRET env var

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Call send-digest endpoint
        env:
          ALERT_DIGEST_URL: ${{ secrets.ALERT_DIGEST_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          : "${ALERT_DIGEST_URL:?Missing GitHub Actions secret ALERT_DIGEST_URL}"
          : "${CRON_SECRET:?Missing GitHub Actions secret CRON_SECRET}"
          curl --fail-with-body --silent --show-error --request POST "$ALERT_DIGEST_URL" \
            --header "X-Cron-Secret: $CRON_SECRET"
