# Render Blueprint for the FastAPI backend.
# Create the service via Render > New > Blueprint, pointing at this repo.
services:
  - type: web
    name: expense-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9 # pin: latest psycopg2-binary has no wheel yet for the newest Python (e.g. 3.14)
      - key: SECRET_KEY
        generateValue: true # Render generates a strong random value
      - key: DATABASE_URL
        sync: false # set manually to your Supabase connection string
      - key: CORS_ORIGINS
        sync: false # set to your frontend URL, e.g. https://your-app.vercel.app
      - key: TRUSTED_PROXY_COUNT
        sync: false # proxies in front of the app, so rate limits are per visitor; see backend/.env.example
      - key: SUPABASE_URL
        sync: false # https://YOUR_PROJECT.supabase.co, enables receipt storage (see README > Receipts)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # server secret from Supabase > Project Settings > API; never put it in the frontend
